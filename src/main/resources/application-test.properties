# Separate H2 instance for tests so they don't interfere with dev
spring.datasource.url=jdbc:h2:mem:smsdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.url=jdbc:h2:mem:smsdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.flyway.user=sa
spring.flyway.password=

# No SQL noise in test output
spring.jpa.show-sql=false

logging.level.com.yourname.sms=WARN

# Self-contained values required when loading the application context in CI.
jwt.secret=test-secret-key-with-at-least-thirty-two-bytes-for-hmac
jwt.expiration-ms=3600000
aws.s3.bucket=test-bucket
aws.s3.region=us-east-1
aws.access.key=test-access-key
aws.secret.key=test-secret-key
